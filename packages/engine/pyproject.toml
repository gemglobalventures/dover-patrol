[project]
name = "dover-engine"
version = "0.1.0"
description = "Dover Patrol rules engine — pure functions, zero I/O"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
